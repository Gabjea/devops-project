repos:
  - id: /.*/
    workflow: floci
    apply_requirements: [mergeable]

workflows:
  floci:
    plan:
      steps:
        - init:
            extra_args: ["-backend-config=backend-atlantis.hcl"]
        - plan
    apply:
      steps:
        - apply
        - run: ../scripts/smoke_test.sh "$(terraform${ATLANTIS_TERRAFORM_VERSION} output -raw api_url)"